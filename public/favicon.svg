<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Circular background badge in brand navy blue -->
  <circle cx="32" cy="32" r="30" fill="#182535" stroke="#C01C1C" stroke-width="2"/>
  
  <!-- Pine trees in background -->
  <polygon points="14,46 22,46 18,34" fill="#416347" />
  <polygon points="42,46 50,46 46,34" fill="#416347" />
  
  <!-- Chimney & Smoke -->
  <rect x="37" y="20" width="4" height="8" fill="#E3DFD5" rx="1"/>
  <circle cx="39" cy="16" r="2" fill="#FAF8F5" opacity="0.7"/>
  <circle cx="41" cy="12" r="2.5" fill="#FAF8F5" opacity="0.4"/>
  
  <!-- Cabin Roof (Brand Red) -->
  <polygon points="16,30 48,30 32,16" fill="#C01C1C" />
  <polygon points="16,30 48,30 32,18" fill="#991B1B" opacity="0.25"/>
  
  <!-- Cabin Walls (Warm Wood) -->
  <rect x="21" y="30" width="22" height="16" fill="#D4B996" rx="1"/>
  
  <!-- Door -->
  <rect x="25" y="36" width="5" height="10" fill="#533B27" rx="0.5"/>
  <circle cx="29" cy="41" r="0.6" fill="#FBBF24"/>
  
  <!-- Window with warm yellow glow -->
  <rect x="33" y="35" width="6" height="6" fill="#FBBF24" rx="1" stroke="#533B27" stroke-width="0.8"/>
  <line x1="36" y1="35" x2="36" y2="41" stroke="#533B27" stroke-width="0.5"/>
  <line x1="33" y1="38" x2="39" y2="38" stroke="#533B27" stroke-width="0.5"/>
  
  <!-- Lake Water Line below -->
  <path d="M 12 48 Q 22 51, 32 48 T 52 48" fill="none" stroke="#407DAF" stroke-width="2.5" stroke-linecap="round"/>
</svg>